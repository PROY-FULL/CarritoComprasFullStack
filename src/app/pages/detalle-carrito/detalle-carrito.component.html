<div class="container">
  @if (error.length > 0) {
    <div class="alert alert-danger d-flex align-items-center" role="alert">
      <i class="bi bi-exclamation-circle"></i>
      <div style="padding-left: 10px">
        {{ error }}
      </div>
    </div>
  }
  <div class="card">
    <div class="card-body">
      <h5 class="card-title">Compra Total</h5>
      <h1 class="card-text">
        {{ Total | currency }}
      </h1>
      <button class="btn btn-success" (click)="realizarPago()">Pagar</button>
    </div>
  </div>
  <div class="p-4">
    <div class="row">
      @for (detalle of Detalles; track detalle.idProducto) {
        <div class="col">
          <div class="card" style="width: 12rem">
            <img
              [src]="detalle.productos.ruta"
              class="card-img-top"
              alt="..."
            />
            <div class="card-body">
              <h5 class="card-title">{{ detalle.productos.precio }}</h5>
              <p class="card-text">
                {{ detalle.productos.descripcion }}
              </p>
              <p class="card-text">Cantidad: {{ detalle.cantidad }}</p>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</div>

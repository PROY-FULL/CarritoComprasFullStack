<div class="container">
  <div id="carouselExampleInterval" class="carousel" data-bs-ride="carousel">
    <div class="carousel-inner">
      <div class="carousel-item active" data-bs-interval="10000">
        <img src="img/carusel/1.jpg" class="d-block w-100 img" alt="..." />
      </div>
      <div class="carousel-item" data-bs-interval="2000">
        <img src="img/carusel/2.jpg" class="d-block w-100 img" alt="..." />
      </div>
      <div class="carousel-item">
        <img src="img/carusel/3.jpg" class="d-block w-100 img" alt="..." />
      </div>
    </div>
    <button
      class="carousel-control-prev"
      type="button"
      data-bs-target="#carouselExampleInterval"
      data-bs-slide="prev"
    >
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button
      class="carousel-control-next"
      type="button"
      data-bs-target="#carouselExampleInterval"
      data-bs-slide="next"
    >
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>
  <div class="p-4">
    <div class="row">
      @for (producto of Productos; track producto.idProducto) {
        <div class="col">
          <div class="card cardancho">
            <img [src]="producto.ruta" class="card-img-top" alt="..." />
            <div class="card-body">
              <h5 class="card-title">{{ producto.precio | currency }}</h5>
              <p class="card-text">
                {{ producto.descripcion }}
              </p>
              <a href="#" class="btn btn-primary" (click)="agregar(producto)"
                >Agregar</a
              >
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</div>
